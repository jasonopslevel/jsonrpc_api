name: Webhook Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-webhooks:
    runs-on: ubuntu-latest

    env:
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
      APP_PORT: 3000

    steps:
      - uses: actions/checkout@v4

      # TODO: replace with your actual build/start steps
      - name: Start app
        run: |
          # e.g. npm install && npm start &
          # e.g. go build && ./server &
          echo "Replace this step with your app startup"
          exit 1

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:$APP_PORT/health && break
            sleep 2
          done

      - name: Send push webhook
        run: |
          PAYLOAD='{"ref":"refs/heads/main","repository":{"full_name":"org/repo"},"commits":[]}'
          SIG="sha256=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $2}')"
          curl -sf -X POST http://localhost:$APP_PORT/webhook \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: $SIG" \
            -d "$PAYLOAD"

      - name: Send pull_request webhook
        run: |
          PAYLOAD='{"action":"opened","number":1,"pull_request":{"title":"Test PR","state":"open"},"repository":{"full_name":"org/repo"}}'
          SIG="sha256=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $2}')"
          curl -sf -X POST http://localhost:$APP_PORT/webhook \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: pull_request" \
            -H "X-Hub-Signature-256: $SIG" \
            -d "$PAYLOAD"

      - name: Reject unsigned request
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:$APP_PORT/webhook \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -d '{"ref":"refs/heads/main"}')
          [ "$RESPONSE" = "401" ] || (echo "Expected 401, got $RESPONSE" && exit 1)
